name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Domain unit tests
        run: ./gradlew :core-domain:test

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      # R8 is only exercised in the release build; a broken libphonenumber -keep rule (empty
      # country picker / normalization crash) is invisible to debug builds and every test
      # (CLAUDE.md §13). CI has no keystore, so this produces an unsigned APK — that must still
      # succeed. The "install a release build and create a +43* rule" check stays manual.
      - name: Assemble release APK (unsigned, R8)
        run: ./gradlew :app:assembleRelease

      - name: Android lint
        run: ./gradlew lint

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/'
          retention-days: 7

  guard-privacy:
    name: Privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fail if an INTERNET permission was introduced
        run: |
          if grep -rq 'android.permission.INTERNET' --include='AndroidManifest.xml' .; then
            echo "::error::VorwahlGuard must never declare the INTERNET permission. See CLAUDE.md section 1."
            exit 1
          fi
          echo "No network permission found. Good."
